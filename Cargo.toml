[package]
name = "feed-the-rat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
feed-rs = "3.0.0"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
